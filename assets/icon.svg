<!-- "Thumbdock" - the react-native-one-hand example-app icon: a full-size phone
     outline with the app docked into its bottom-right corner, within thumb reach. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF5FC"/>
      <stop offset="1" stop-color="#CBE2F3"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- ghost phone (full-size app) -->
  <rect x="297" y="112" width="430" height="800" rx="96" fill="none" stroke="#9FC1DC" stroke-width="30"/>
  <!-- docked phone at 0.7 scale, flush with the ghost's outer bottom-right corner -->
  <rect x="441" y="367" width="301" height="560" rx="67" fill="#0284C7"/>
  <rect x="489" y="480" width="205" height="37" rx="18.5" fill="#FFFFFF" opacity="0.92"/>
  <rect x="489" y="547" width="152" height="37" rx="18.5" fill="#FFFFFF" opacity="0.55"/>
  <rect x="489" y="614" width="178" height="37" rx="18.5" fill="#FFFFFF" opacity="0.55"/>
  <rect x="489" y="681" width="128" height="37" rx="18.5" fill="#FFFFFF" opacity="0.55"/>
</svg>
